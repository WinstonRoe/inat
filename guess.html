<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>

      // dark-mode.js (end of body) syncs <body> and builds the toggle.
      if (localStorage.getItem("darkMode") === "true") {
        document.documentElement.classList.add("dark-mode");
      }
    </script>

    <meta

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Guess the Species",
      "description": "An endless iNaturalist species quiz: one photo, four choices, unlimited rounds, with an optional location filter.",
      "url": "https://WinstonRoe.github.io/inat/guess",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": {
        "@type": "Person",
        "name": "Glauber Ramos"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "iNaturalist Tools", "item": "https://WinstonRoe.github.io/inat/" },
        { "@type": "ListItem", "position": 2, "name": "Guess the Species", "item": "https://WinstonRoe.github.io/inat/guess" }
      ]
    }
    </script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="dark-mode.css?v=8" />
    <link rel="stylesheet" href="guess.css?v=4" />
  </head>
  <body class="guess-page">
    <a href="/inat" class="back-button">
      <span style="font-size:1rem;">&#8592;</span> More tools
    </a>
    <div class="container">
      <header>
        <div class="header-content">
          <div class="title-container">
            <img src="logo.png" alt="iNaturalist Logo" class="logo" />
            <h1>Guess the Species</h1>
          </div>
          <p class="description">
            One photo, four choices, one winner. Play as long as you like —
            change the place to quiz species from anywhere on Earth.
          </p>
        </div>
      </header>

      <div class="place-bar" aria-label="Location filter">
        <label class="place-bar-label" for="locationInput">Place</label>
        <div class="place-bar-input-wrap">
          <input
            id="locationInput"
            type="text"
            class="place-input"
            placeholder="Anywhere (optional)"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="placeClear" class="place-clear" type="button" title="Clear place" hidden>&#215;</button>
          <div id="locationAutocomplete" class="place-autocomplete"></div>
          <input type="hidden" id="placeId" value="" />
        </div>
      </div>

      <div class="session-strip" aria-label="Session progress">
        <span class="session-cell">
          <span class="session-value" id="solvedCount">0</span>
          <span class="session-label">solved</span>
        </span>
        <span class="session-cell">
          <span class="session-value" id="missedCount">0</span>
          <span class="session-label">missed</span>
        </span>
        <span class="session-meta" id="sessionMeta"></span>
      </div>

      <div id="stage" class="guess-stage" aria-live="polite"></div>

      <p class="guess-note" id="guessNote" style="display:none"></p>
    </div>

    <button class="feedback-button" id="feedbackBtn">Send feedback</button>

    <script src="constants.js"></script>
    <script src="shared-utils.js?v=9"></script>
    <script src="location-autocomplete.js?v=2"></script>
    <script>
      const STORAGE_KEY = "inat-guess-v3";
      const POOL_PER_PAGE = 500;
      const CHOICE_COUNT = 4;

      const stage = document.getElementById("stage");
      const noteEl = document.getElementById("guessNote");
      const solvedEl = document.getElementById("solvedCount");
      const missedEl = document.getElementById("missedCount");
      const sessionMetaEl = document.getElementById("sessionMeta");
      const locationInput = document.getElementById("locationInput");
      const locationAutocomplete = document.getElementById("locationAutocomplete");
      const placeIdInput = document.getElementById("placeId") || null;

      // ---- session persistence ----------------------------------------------
      function loadAllSessions() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (err) {
          return {};
        }
      }

      function saveAllSessions(map) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
        } catch (err) {
          // Private mode / quota — keep playing without persistence.
        }
      }

      // ---- current place ----------------------------------------------------
      function currentPlaceId() {
        // Prefer the hidden input (kept in sync by location-autocomplete) when
        // present; fall back to the URL so a direct share link works even
        // before the autocomplete script has had a chance to run.
        if (placeIdInput && placeIdInput.value) return placeIdInput.value;
        const params = new URLSearchParams(window.location.search);
        return params.get("place_id") || "";
      }

      function placeKey() {
        const id = currentPlaceId();
        return sessionKeyForPlace(id);
      }

      function placeLabel() {
        const inputVal = locationInput && locationInput.value.trim();
        if (inputVal) return inputVal;
        const params = new URLSearchParams(window.location.search);
        return params.get("place") || "Anywhere";
      }

      // ---- pool + session state ---------------------------------------------
      // pool: array of {taxonId, obsId, name, common, photo}
      // order: array of pool indices in play order for the current shuffle
      let pool = [];
      let order = [];
      let session = { solved: 0, missed: 0, started: -1, shuffleSeed: "" };
      let exhausted = false;
      let current = null;

      function newShuffleSeed() {
        const d = new Date();
        const rand = fnv1aHash(Math.random().toString(36).slice(2) + ":" + d.getTime());
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0") +
          "-" +
          String(rand)
        );
      }

      // Deterministic full-order shuffle of [0..n-1] by seed. Every index
      // appears exactly once; the same (n, seed) pair always yields the same
      // order — which is what lets a refresh mid-run resume in place.
      function fullShuffle(n, seed) {
        const remaining = [];
        for (let i = 0; i < n; i++) remaining.push(i);
        const out = [];
        while (remaining.length) {
          const h = fnv1aHash(seed + "#" + out.length);
          const pick = h % remaining.length;
          out.push(remaining.splice(pick, 1)[0]);
        }
        return out;
      }

      function bestPhotoOf(r) {
        const t = r.taxon;
        const dp =
          t && t.default_photo
            ? t.default_photo.url || (t.default_photo.medium && t.default_photo.medium.url)
            : "";
        if (dp) return dp;
        const op = r.photo && (r.photo.url || (r.photo.medium && r.photo.medium.url));
        return op || "";
      }

      async function loadPool() {
        const id = currentPlaceId();
        const placeQ = id ? "&place_id=" + encodeURIComponent(id) : "";
        const data = await fetchJSON(
          `${API_BASE}/observations?has_photos=true&order_by=created_at&order=desc&per_page=${POOL_PER_PAGE}${placeQ}`
        );
        const rows = [];
        const seen = new Set();
        for (const r of data.results || []) {
          const t = r.taxon;
          if (!t || !t.min_species_taxon_id || seen.has(t.min_species_taxon_id)) continue;
          seen.add(t.min_species_taxon_id);
          rows.push({
            taxonId: t.min_species_taxon_id,
            obsId: r.id,
            name: t.name,
            common: t.preferred_common_name || "",
            photo: bestPhotoOf(r),
          });
        }
        return rows;
      }

      // `session.started` = index into `order` of the puzzle currently on
      // screen (the one the user is about to answer or just answered).
      // -1 / 0 both mean "fresh start at order[0]".
      function resetSession() {
        session = { solved: 0, missed: 0, started: 0, shuffleSeed: newShuffleSeed() };
      }

      function resumeIfPossible() {
        const all = loadAllSessions();
        const prev = all[placeKey()];
        if (!prev || !prev.shuffleSeed) return false;
        // Only resume if the saved pool size matches the freshly loaded pool
        // AND the saved cursor is still in range; otherwise the saved order
        // would not be a permutation of the current pool.
        if (prev.poolSize !== pool.length) return false;
        const s = typeof prev.started === "number" ? prev.started : 0;
        if (s < 0 || s >= pool.length) return false;
        session.solved = prev.solved || 0;
        session.missed = prev.missed || 0;
        session.started = s;
        session.shuffleSeed = prev.shuffleSeed;
        order = fullShuffle(pool.length, session.shuffleSeed);
        return true;
      }

      function commitSession() {
        const all = loadAllSessions();
        all[placeKey()] = {
          solved: session.solved,
          missed: session.missed,
          started: session.started,
          shuffleSeed: session.shuffleSeed,
          poolSize: pool.length,
        };
        saveAllSessions(all);
      }

      // ---- rendering --------------------------------------------------------
      function updateScorebar() {
        solvedEl.textContent = String(session.solved);
        missedEl.textContent = String(session.missed);
        const shown = session.started >= 0 ? session.started + 1 : 0;
        if (pool.length === 0) {
          sessionMetaEl.textContent = "\u00b7 " + placeLabel() + " \u00b7 warming up\u2026";
        } else {
          sessionMetaEl.textContent =
            "\u00b7 " + placeLabel() +
            " \u00b7 puzzle " + shown + " of " + pool.length;
        }
      }

      function skeletonCard() {
        return (
          '<div class="guess-card">' +
          '<div class="guess-photo guess-photo-skeleton"></div>' +
          '<div class="guess-body">' +
          '<div class="guess-skel-line"></div>' +
          '<div class="guess-skel-line guess-skel-line-short"></div>' +
          '</div>' +
          '</div>'
        );
      }

      function buildChoices(rowIdx) {
        // Row is the correct one. Pick up to (CHOICE_COUNT - 1) distinct
        // distractors from the pool (excluding rowIdx), deterministically.
        const seed = session.shuffleSeed + ":" + placeKey() + ":" + session.started + ":" + rowIdx + ":" + pool[rowIdx].taxonId;
        const distract = pickChoices(seed, pool.length, rowIdx, CHOICE_COUNT - 1);
        const set = new Set([rowIdx]);
        for (const d of distract) set.add(d);
        // Deterministic presentation: correct slot first, distractors in pick-order.
        // This keeps the letter assignment stable across refreshes for a given
        // seed (and still varies across seeds).
        return [rowIdx, ...distract];
      }

      function renderStage() {
        if (exhausted && !current) {
          stage.innerHTML =
            '<div class="guess-card guess-card-done">' +
            '<div class="guess-body">' +
            '<div class="guess-status guess-status-solved">Ran out of species in that area!</div>' +
            '<p class="guess-end-msg">You beat the whole pool this pass. Change the place above to keep going, or <button type="button" class="guess-inline-restart" id="restartBtn">start a new shuffle</button>.</p>' +
            '</div>' +
            '</div>';
          const btn = document.getElementById("restartBtn");
          if (btn) btn.addEventListener("click", newShuffle);
          updateScorebar();
          return;
        }

        if (!current) {
          stage.innerHTML = skeletonCard();
          updateScorebar();
          return;
        }

        const row = current.row;
        const photoHtml = row.photo
          ? '<img class="guess-photo" src="' + escapeHtml(row.photo) + '" alt="Mystery species" loading="lazy" />'
          : '<div class="guess-photo guess-photo-empty" aria-hidden="true">&#129417;</div>';

        const choicesHtml = current.choices
          .map((i, k) => {
            const r = pool[i];
            const isCorrect = i === current.correctIdx;
            const isWrongPick = current.resolved && i === current.pickedIdx && !isCorrect;
            let cls = "choice-btn";
            if (current.resolved) cls += " choice-btn-resolved";
            if (current.resolved && isCorrect) cls += " choice-btn-correct";
            if (isWrongPick) cls += " choice-btn-wrong";
            const label =
              r.common && r.common.toLowerCase() !== r.name.toLowerCase()
                ? r.name + " — " + r.common
                : r.name;
            return (
              '<button type="button" class="' + cls + '" data-idx="' + i + '"' +
              (current.resolved ? " disabled" : "") + ">" +
              '<span class="choice-letter">' + String.fromCharCode(65 + k) + '</span>' +
              '<span class="choice-text">' + escapeHtml(label) + '</span>' +
              '</button>'
            );
          })
          .join("");

        let statusHtml;
        if (current.resolved && current.wasCorrect) {
          statusHtml =
            '<div class="guess-status guess-status-solved">Solved! — <em>' +
            escapeHtml(row.name) +
            (row.common ? " (" + escapeHtml(row.common) + ")" : "") +
            "</em></div>";
        } else if (current.resolved) {
          statusHtml =
            '<div class="guess-status guess-status-missed">Missed. It was <em>' +
            escapeHtml(row.name) +
            (row.common ? " (" + escapeHtml(row.common) + ")" : "") +
            "</em></div>";
        } else {
          statusHtml = '<p class="guess-prompt">Which is it?</p>';
        }

        const nextBtnHtml = current.resolved
          ? '<div class="guess-next-row"><button type="button" class="guess-next" id="nextBtn">' +
            (session.started + 1 >= pool.length ? "Keep going" : "Next species &#8594;") +
            "</button></div>"
          : "";

        const footerHtml =
          '<div class="guess-footer">' +
          '<a class="guess-taxon-link" href="https://www.inaturalist.org/taxa/' +
          row.taxonId +
          '" target="_blank" rel="noopener">Taxon page &#8599;</a>' +
          "</div>";

        stage.innerHTML =
          '<div class="guess-card ' +
          (current.resolved ? (current.wasCorrect ? "guess-card-solved" : "guess-card-missed") : "") +
          '">' +
          photoHtml +
          '<div class="guess-body">' +
          statusHtml +
          '<div class="choice-grid" role="group" aria-label="Answer choices">' + choicesHtml + "</div>" +
          nextBtnHtml +
          footerHtml +
          "</div>" +
          "</div>";

        if (current.resolved) {
          const next = document.getElementById("nextBtn");
          if (next) {
            next.addEventListener("click", advance);
            next.focus();
          }
        } else {
          for (const b of stage.querySelectorAll("button.choice-btn")) {
            const idx = Number(b.getAttribute("data-idx"));
            b.addEventListener("click", () => pick(idx));
          }
        }
        updateScorebar();
      }

      function showError(msg) {
        noteEl.textContent = msg;
        noteEl.style.display = "block";
        noteEl.className = "guess-note guess-error";
      }

      function clearNote() {
        noteEl.style.display = "none";
        noteEl.textContent = "";
        noteEl.className = "guess-note";
      }

      // ---- game flow --------------------------------------------------------
      function startPuzzleAt(startedIdx) {
        const rowIdx = order[startedIdx];
        const row = pool[rowIdx];
        current = {
          rowIdx,
          correctIdx: rowIdx,
          choices: buildChoices(rowIdx),
          row,
          resolved: false,
          wasCorrect: false,
          pickedIdx: -1,
        };
        renderStage();
      }

      function pick(idx) {
        if (!current || current.resolved) return;
        current.resolved = true;
        current.pickedIdx = idx;
        current.wasCorrect = idx === current.correctIdx;
        if (current.wasCorrect) session.solved++;
        else session.missed++;
        commitSession();
        renderStage();
      }

      function advance() {
        if (!current || !current.resolved) return;
        session.started += 1;
        if (session.started >= pool.length) {
          current = null;
          exhausted = true;
          commitSession();
          renderStage();
          return;
        }
        commitSession();
        startPuzzleAt(session.started);
      }

      async function startSession() {
        clearNote();
        current = null;
        exhausted = false;
        pool = [];
        order = [];
        stage.innerHTML = skeletonCard();
        updateScorebar();
        try {
          pool = await loadPool();
          if (pool.length < 2) {
            exhausted = true;
            renderStage();
            showError(
              "Not enough species with photos in that place. Try a bigger area or clear the filter."
            );
            return;
          }
          if (!resumeIfPossible()) {
            resetSession();
            order = fullShuffle(pool.length, session.shuffleSeed);
            commitSession();
          }
          if (session.started >= pool.length) {
            exhausted = true;
            renderStage();
            return;
          }
          startPuzzleAt(session.started);
        } catch (err) {
          stage.innerHTML = "";
          showError(
            (err && err.message ? err.message : "Could not load species for that place.") +
            " Try again in a moment."
          );
        }
      }

      function newShuffle() {
        clearNote();
        current = null;
        exhausted = false;
        // Keep the current pool (already loaded) but mint a new shuffle.
        if (pool.length < 2) {
          startSession();
          return;
        }
        resetSession();
        order = fullShuffle(pool.length, session.shuffleSeed);
        commitSession();
        startPuzzleAt(0);
      }

      // ---- wire up location ---------------------------------------------------
      function onPlaceChanged() {
        updateClearButton();
        // A place change always begins a fresh session for that place.
        startSession();
      }

      function updateClearButton() {
        const has = !!(locationInput && locationInput.value && locationInput.value.trim());
        const clearBtn = document.getElementById("placeClear");
        if (clearBtn) clearBtn.hidden = !has;
      }

      async function init() {
        // Hide the clear button until there's a selection.
        updateClearButton();

        if (typeof initLocationAutocomplete === "function") {
          initLocationAutocomplete(
            locationInput,
            locationAutocomplete,
            placeIdInput || null,
            {
              persistToStorage: true,
              loadFromStorage: true,
              loadFromUrl: true,
              updateUrlOnSelect: true,
              includeProjects: false,
              onSelect: onPlaceChanged,
              onClear: onPlaceChanged,
            }
          );
        }

        const clearBtn = document.getElementById("placeClear");
        if (clearBtn) {
          clearBtn.addEventListener("click", () => {
            locationInput.value = "";
            if (placeIdInput) placeIdInput.value = "";
            if (typeof updateUrlWithPlace === "function") updateUrlWithPlace("", "");
            try {
              localStorage.removeItem("inatPlaceId");
              localStorage.removeItem("inatPlaceName");
            } catch (err) {
              // ignore
            }
            updateClearButton();
            onPlaceChanged();
          });
        }

        // Keep the clear button visible state in sync as the user types.
        locationInput.addEventListener("input", updateClearButton);

        await startSession();
      }

      init();

      initFeedbackButton ? initFeedbackButton() : null;
      if (typeof registerServiceWorker === "function") registerServiceWorker();
    </script>
    <script
      defer
      data-domain="WinstonRoe.github.io/inat"
      src="https://plausible.io/js/script.js"
    ></script>
    <script src="dark-mode.js?v=2"></script>
  </body>
</html>
